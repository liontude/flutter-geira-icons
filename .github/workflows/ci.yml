name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
